<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>找到你的美食搭檔！</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>找到你的美食搭檔！</h1>
        <div id="quiz">
            <div id="question-container">
                <h2 id="question"></h2>
                <div id="answer-buttons" class="btn-container"></div>
            </div>
            <button id="next-button" class="btn" style="display: none;">下一題</button>
        </div>
        <div id="result" class="result-container" style="display: none;">
            <h2>你的推薦餐廳是：</h2>
            <p id="result-text"></p>
            <button id="restart-button" class="btn">重新開始</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
